<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contoso Customer Portal</title>
  <meta name="description" content="Customer API release status">
  <style>
    :root { --ink: #172033; --paper: #f4f0e6; --card: #fffdf7; --line: #c8bfac; --red: #b42318; --green: #067647; --blue: #175cd3; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 28px; color: var(--ink); background: var(--paper); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    main { width: min(900px, 100%); margin: 0 auto; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; padding: 28px 0 18px; border-bottom: 3px solid var(--ink); }
    .kicker { margin: 0 0 8px; color: var(--blue); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(34px, 7vw, 62px); font-weight: 400; line-height: .95; }
    .release { padding: 8px 11px; border: 1px solid var(--ink); background: var(--card); font-size: 12px; box-shadow: 4px 4px 0 var(--ink); }
    .panel { margin-top: 34px; padding: 28px; border: 1px solid var(--line); background: var(--card); box-shadow: 10px 10px 0 #ded7c8; }
    h2 { margin: 0; font: 600 20px/1.3 ui-monospace, monospace; }
    .status { display: inline-block; margin-top: 18px; padding: 7px 10px; border: 1px solid currentColor; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .status.loading { color: var(--blue); }
    .status.failed { color: var(--red); }
    .status.healthy { color: var(--green); }
    pre { min-height: 180px; margin: 20px 0 0; padding: 18px; overflow-x: auto; color: #d0d5dd; border-radius: 4px; background: #101828; font: 13px/1.6 ui-monospace, monospace; white-space: pre-wrap; }
    button { margin-top: 18px; padding: 11px 15px; color: white; border: 0; background: var(--ink); font: 700 13px ui-monospace, monospace; cursor: pointer; }
    button:hover { background: var(--blue); }
    footer { margin-top: 34px; color: #667085; font-size: 11px; }
    @media (max-width: 600px) { body { padding: 18px; } header { align-items: flex-start; flex-direction: column; } .panel { padding: 20px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="kicker">Contoso services</p><h1>Customer portal</h1></div>
      <span class="release">Release 42</span>
    </header>
    <section class="panel">
      <h2>Customer API response</h2>
      <span id="status" class="status loading">Request in progress</span>
      <pre id="response">Waiting for /api/customer...</pre>
      <button id="retry" type="button">Send request again</button>
    </section>
    <footer>REQUEST PATH /api/customer · DEPLOYMENT CHANNEL production</footer>
  </main>
  <script>
    const status = document.querySelector("#status");
    const output = document.querySelector("#response");
    const retry = document.querySelector("#retry");

    async function loadCustomerData() {
      status.className = "status loading";
      status.textContent = "Request in progress";
      retry.disabled = true;
      try {
        const response = await fetch("/api/customer");
        const body = await response.json();
        status.className = `status ${response.ok ? "healthy" : "failed"}`;
        status.textContent = `HTTP ${response.status} · ${response.ok ? "healthy" : "failed"}`;
        output.textContent = JSON.stringify(body, null, 2);
      } catch (error) {
        status.className = "status failed";
        status.textContent = "Request failed";
        output.textContent = error.message;
      } finally {
        retry.disabled = false;
      }
    }

    retry.addEventListener("click", loadCustomerData);
    loadCustomerData();
  </script>
</body>
</html>
